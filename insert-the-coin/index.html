<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Insert the coin</title>
<style>
:root{
  --bg:#f3f3f3; --btn:#5a5a5a; --btn-bg:#e6e6e6; --btn-hover:#d9d9d9;
  --s:min(48vw, 58vh, 380px);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#2a2a2a; --btn:#bdbdbd; --btn-bg:#363636; --btn-hover:#424242; }
}
:root[data-theme="dark"]{ --bg:#2a2a2a; --btn:#bdbdbd; --btn-bg:#363636; --btn-hover:#424242; }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.row{display:flex;align-items:center;gap:calc(var(--s)*0.34)}
#slot{width:var(--s);height:auto;display:block;overflow:visible}
#home{width:calc(var(--s)*0.41);aspect-ratio:1;transform:translateY(calc(var(--s)*0.18))}
#coin{position:absolute;left:0;top:0;width:calc(var(--s)*0.41);aspect-ratio:1;touch-action:none;cursor:grab;
  will-change:transform;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25));transition:filter .12s ease-out}
#coin.lifted{cursor:grabbing;filter:drop-shadow(0 16px 10px rgba(0,0,0,.26))}
#coin.flat{filter:none}
#coin:focus-visible{outline:2px solid var(--btn);outline-offset:4px;border-radius:50%}
#coin .face{width:100%;height:100%;transform-origin:50% 50%}
#coin svg{width:100%;height:100%;display:block;pointer-events:none}
#inner-outline{transition:stroke .45s ease, stroke-width .2s ease}
#reset{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;
  border:0;background:var(--btn-bg);color:var(--btn);display:grid;place-items:center;cursor:pointer;transition:background .15s}
#reset:hover{background:var(--btn-hover)}
#reset:focus-visible{outline:2px solid var(--btn);outline-offset:3px}
#reset svg{width:20px;height:20px}
#mute{position:absolute;right:68px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;
  border:0;background:var(--btn-bg);color:var(--btn);display:grid;place-items:center;cursor:pointer;transition:background .15s}
#mute:hover{background:var(--btn-hover)}
#mute:focus-visible{outline:2px solid var(--btn);outline-offset:3px}
#mute svg{width:20px;height:20px}
#mute .off{display:none}
#mute[aria-pressed="true"] .on{display:none}
#mute[aria-pressed="true"] .off{display:inline}
</style>
</head>
<body>
<div id="stage">
  <div class="row">
    <div id="home" aria-hidden="true"></div>
    <svg id="slot" viewBox="76 66 248 268" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Coin slot">
      <defs>
        <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#d4d4d4"/><stop offset="100%" stop-color="#a8a8a8"/></linearGradient>
        <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e8e8e8"/><stop offset="100%" stop-color="#b5b5b5"/></linearGradient>
        <linearGradient id="opening" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#111111"/><stop offset="100%" stop-color="#3a3a3a"/></linearGradient>
      </defs>
      <g id="machine">
        <rect x="80" y="70" width="240" height="260" rx="10" fill="url(#panel)" stroke="#000" stroke-width="4"/>
        <rect x="160" y="120" width="80" height="160" rx="8" fill="url(#plate)" stroke="#000" stroke-width="3"/>
        <rect id="inner-outline" x="168" y="128" width="64" height="144" rx="5" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
        <rect x="192" y="145" width="16" height="110" rx="8" fill="url(#opening)" stroke="#000" stroke-width="3"/>
        <rect id="glint" x="193.5" y="146.5" width="13" height="107" rx="6.5" fill="#ffffff" opacity="0"/>
        <line id="lip" x1="212" y1="153" x2="212" y2="247" stroke="#ffffff" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
      </g>
    </svg>
  </div>

  <div id="coin" tabindex="0" role="button" aria-label="Coin">
    <div class="face">
      <svg viewBox="48 48 304 304" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="face" cx="40%" cy="35%" r="70%"><stop offset="0%" stop-color="#f2f2f2"/><stop offset="55%" stop-color="#c4c4c4"/><stop offset="100%" stop-color="#8c8c8c"/></radialGradient>
          <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#e6e6e6"/><stop offset="50%" stop-color="#a6a6a6"/><stop offset="100%" stop-color="#6e6e6e"/></linearGradient>
          <linearGradient id="inner" x1="1" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#d9d9d9"/><stop offset="100%" stop-color="#9a9a9a"/></linearGradient>
        </defs>
        <circle cx="200" cy="200" r="150" fill="url(#rim)" stroke="#000" stroke-width="4"/>
        <circle cx="200" cy="200" r="128" fill="url(#inner)" stroke="#555" stroke-width="1.5"/>
        <circle cx="200" cy="200" r="120" fill="url(#face)" stroke="#777" stroke-width="1"/>
        <circle cx="200" cy="200" r="70" fill="none" stroke="#9e9e9e" stroke-width="2" opacity="0.6"/>
        <ellipse cx="160" cy="150" rx="50" ry="28" fill="#ffffff" opacity="0.35" transform="rotate(-35 160 150)"/>
      </svg>
    </div>
  </div>

  <button id="mute" aria-label="Mute" aria-pressed="false">
    <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
    <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6"/><path d="M22 9l-5 6"/></svg>
  </button>
  <button id="reset" aria-label="Reset">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
  </button>
</div>

<script>
(() => {
  const stage = document.getElementById('stage');
  const coin = document.getElementById('coin');
  const face = coin.querySelector('.face');
  const slot = document.getElementById('slot');
  const machine = document.getElementById('machine');
  const home = document.getElementById('home');
  const outline = document.getElementById('inner-outline');
  const glint = document.getElementById('glint');
  const lip = document.getElementById('lip');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- Synthesized sound (Web Audio, no files) ----
  const Sound = (() => {
    let ctx = null, master = null, muted = false, noiseBuf = null;
    function unlock(){
      if (!ctx){
        const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
        ctx = new AC();
        const comp = ctx.createDynamicsCompressor();
        master = ctx.createGain(); master.gain.value = 0.6;
        master.connect(comp); comp.connect(ctx.destination);
      }
      if (ctx.state === 'suspended') ctx.resume();
    }
    const ok = () => ctx && !muted;
    function noise(){
      if (!noiseBuf){
        noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      const n = ctx.createBufferSource(); n.buffer = noiseBuf; return n;
    }
    function env(g, t, peak, decay){
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + 0.003);
      g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
    }
    // metal: inharmonic partials of a struck disc
    function ring(t, base, vol, decay, dest){
      [1, 2.76, 5.4, 8.93].forEach((r, i) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = base * r * (1 + (Math.random() - .5) * 0.01);
        env(g, t, vol / (i + 1.3), decay / (1 + i * 0.6));
        o.connect(g); g.connect(dest || master); o.start(t); o.stop(t + decay + 0.05);
      });
    }
    function click(t, vol, freq, dur, dest){
      const n = noise(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 1.2;
      env(g, t, vol, dur);
      n.connect(f); f.connect(g); g.connect(dest || master); n.start(t); n.stop(t + dur + 0.02);
    }
    function thump(t, vol, f0, f1, dur, dest){
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      env(g, t, vol, dur);
      o.connect(g); g.connect(dest || master); o.start(t); o.stop(t + dur + 0.02);
    }
    function muffled(cut){
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cut; f.connect(master); return f;
    }
    return {
      unlock,
      get muted(){ return muted; }, set muted(v){ muted = v; },
      pickup(){ if (!ok()) return; const t = ctx.currentTime;
        click(t, 0.22, 3200, 0.03); ring(t, 1850, 0.05, 0.12); },
      land(p){ if (!ok()) return; const t = ctx.currentTime;
        thump(t, 0.1 + 0.45 * p, 140, 55, 0.12); click(t, 0.35 * p, 2400, 0.04); ring(t + 0.002, 1650, 0.12 * p, 0.35); },
      snap(){ if (!ok()) return; const t = ctx.currentTime;
        click(t, 0.4, 4200, 0.025); ring(t, 2300, 0.15, 0.26); thump(t, 0.18, 320, 180, 0.05); },
      drop(delay){ if (!ok()) return; const m = muffled(2200);
        let t = ctx.currentTime + delay;
        thump(t, 0.65, 130, 42, 0.16, m); click(t, 0.42, 1400, 0.035, m); ring(t, 1500, 0.14, 0.12, m);
        t += 0.045; ring(t, 1700, 0.05, 0.08, m); click(t, 0.12, 1800, 0.02, m); },
      accept(){ if (!ok()) return; const t = ctx.currentTime + 0.01;
        thump(t, 0.4, 85, 40, 0.22); click(t, 0.18, 900, 0.05);
        const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'triangle'; o.frequency.value = 660;
        g.gain.setValueAtTime(0.0001, t + 0.12); g.gain.exponentialRampToValueAtTime(0.05, t + 0.14);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
        o.connect(g); g.connect(master); o.start(t + 0.12); o.stop(t + 0.45); }
    };
  })();

  // viewBox of slot svg
  const VB = {x:76, y:66, w:248, h:268};
  let geo = {};
  const s = { x:0, y:0, vx:0, vy:0, tx:0, ty:0, k:180, c:22, tilt:0, lift:1, liftT:1 };
  let mode = 'idle', grab = {dx:0, dy:0}, inserted = false, active = false;
  let retDir = {x:0, y:0}, prevAlong = 0, bounces = 0;

  function measure(){
    const st = stage.getBoundingClientRect();
    const h = home.getBoundingClientRect();
    const r = slot.getBoundingClientRect();
    const sc = r.width / VB.w;
    const map = (ux, uy) => ({ x: r.left - st.left + (ux - VB.x) * sc, y: r.top - st.top + (uy - VB.y) * sc });
    const c = map(200, 200);
    const p0 = map(160, 120), p1 = map(240, 280);
    geo = {
      home: { x: h.left - st.left + h.width/2, y: h.top - st.top + h.height/2 },
      size: h.width, slot: c, sc,
      plate: { l:p0.x, t:p0.y, r:p1.x, b:p1.y }
    };
  }

  function render(){
    const half = geo.size / 2;
    coin.style.transform = `translate(${s.x - half}px, ${s.y - half}px) rotate(${s.tilt}deg) scale(${s.lift})`;
  }

  function overPlate(x, y){
    const m = geo.size * 0.3, p = geo.plate;
    return x > p.l - m && x < p.r + m && y > p.t - m && y < p.b + m;
  }

  function proximity(){
    if (active) return;
    let p = 0;
    if (mode === 'drag'){
      const d = Math.hypot(s.x - geo.slot.x, s.y - geo.slot.y);
      p = Math.max(0, Math.min(1, 1 - d / (geo.size * 3)));
      if (overPlate(s.x, s.y)) p = 1;
    }
    const v = Math.round(138 - p * 88);
    outline.style.stroke = `rgb(${v},${v},${v})`;
    outline.setAttribute('stroke-width', (1.5 + p * 1.5).toFixed(2));
  }

  let last = performance.now();
  function tick(now){
    let dt = Math.min(0.033, (now - last) / 1000); last = now;
    if (mode !== 'gone'){
      const steps = 4, h = dt / steps;
      for (let i = 0; i < steps; i++){
        const ax = s.k * (s.tx - s.x) - s.c * s.vx;
        const ay = s.k * (s.ty - s.y) - s.c * s.vy;
        s.vx += ax * h; s.vy += ay * h;
        s.x += s.vx * h; s.y += s.vy * h;
      }
      // weight: tilt with horizontal velocity, settle when not dragging
      const tiltT = mode === 'drag' ? Math.max(-9, Math.min(9, s.vx * 0.012)) : (mode === 'insert' ? 0 : s.vx * 0.006);
      s.tilt += (tiltT - s.tilt) * Math.min(1, dt * 14);
      s.lift += (s.liftT - s.lift) * Math.min(1, dt * 30);
      render();
      proximity();

      if (mode === 'return'){
        const dx = s.x - s.tx, dy = s.y - s.ty;
        const along = dx * retDir.x + dy * retDir.y;
        if ((prevAlong < 0) !== (along < 0)){
          const v = Math.hypot(s.vx, s.vy);
          if (v > 120 && bounces < 3){ Sound.land(Math.min(1, v / 1400)); bounces++; }
        }
        prevAlong = along;
        if (Math.hypot(dx, dy) < 0.5 && Math.hypot(s.vx, s.vy) < 5) mode = 'idle';
      }

      if (mode === 'insert' && !inserted){
        const d = Math.hypot(s.tx - s.x, s.ty - s.y), v = Math.hypot(s.vx, s.vy);
        if (d < 4 && v < 220){ s.x = s.tx; s.y = s.ty; s.vx = s.vy = 0; s.tilt = 0; render(); sink(); }
      }
    }
    requestAnimationFrame(tick);
  }

  function onDown(e){
    if (mode === 'insert' || mode === 'gone') return;
    e.preventDefault();
    coin.setPointerCapture(e.pointerId);
    const st = stage.getBoundingClientRect();
    grab.dx = (e.clientX - st.left) - s.x;
    grab.dy = (e.clientY - st.top) - s.y;
    mode = 'drag';
    s.k = reduced ? 900 : 170; s.c = reduced ? 60 : 21;   // heavy follow with slight lag
    s.liftT = 1.05; s.lift = 1.03;                        // immediate pick-up response
    s.ty -= geo.size * 0.03; s.y -= geo.size * 0.02;
    coin.classList.add('lifted');
    Sound.unlock(); Sound.pickup();
  }
  function onMove(e){
    if (mode !== 'drag') return;
    const st = stage.getBoundingClientRect();
    s.tx = (e.clientX - st.left) - grab.dx;
    s.ty = (e.clientY - st.top) - grab.dy;
  }
  function onUp(){
    if (mode !== 'drag') return;
    coin.classList.remove('lifted');
    s.liftT = 1;
    if (overPlate(s.x, s.y)){
      mode = 'insert';
      s.tx = geo.slot.x; s.ty = geo.slot.y;
      s.k = reduced ? 900 : 760; s.c = reduced ? 60 : 50;   // short, decisive snap
    } else {
      mode = 'return';
      { const dx = geo.home.x - s.x, dy = geo.home.y - s.y, L = Math.hypot(dx, dy) || 1;
        retDir = { x:dx / L, y:dy / L }; prevAlong = -L; bounces = 0; }
      s.tx = geo.home.x; s.ty = geo.home.y;
      s.k = reduced ? 900 : 190; s.c = reduced ? 60 : 13;   // weighted bounce home
    }
  }

  function sink(){
    inserted = true;
    coin.classList.add('flat');
    Sound.snap();
    const edge = (16 * geo.sc) / geo.size * 0.9;
    const dur = reduced ? 160 : 300;
    Sound.drop(dur * 0.55 / 1000);
    const a = face.animate([
      { transform:'scale(1,1)', filter:'brightness(1)', opacity:1, easing:'cubic-bezier(.5,0,1,.5)' },
      { transform:`scale(${edge},1)`, filter:'brightness(.85)', opacity:1, offset:.45, easing:'cubic-bezier(.7,0,1,.6)' },
      { transform:`scale(${edge * .6},.78) translateY(6%)`, filter:'brightness(.15)', opacity:0 }
    ], { duration: dur, fill:'forwards' });
    a.onfinish = () => { mode = 'gone'; coin.style.visibility = 'hidden'; accept(); };
  }

  function accept(){
    active = true;
    Sound.accept();
    if (!reduced){
      machine.animate([
        { transform:'translateY(0)' },
        { transform:'translateY(4px)', offset:.18, easing:'cubic-bezier(.2,.7,.3,1)' },
        { transform:'translateY(0)' }
      ], { duration: 240 });
    }
    glint.animate([{opacity:0},{opacity:.4, offset:.3},{opacity:0}], { duration: reduced ? 200 : 520, easing:'ease-out' });
    outline.style.stroke = '#f4f4f4';
    outline.setAttribute('stroke-width', '2');
    lip.setAttribute('opacity', '1');
  }

  function reset(){
    face.getAnimations().forEach(a => a.cancel());
    coin.classList.remove('flat','lifted');
    coin.style.visibility = 'visible';
    inserted = false; active = false; mode = 'idle';
    lip.setAttribute('opacity', '0.6');
    outline.style.stroke = '#8a8a8a';
    outline.setAttribute('stroke-width', '1.5');
    measure();
    Object.assign(s, { x:geo.home.x, y:geo.home.y, tx:geo.home.x, ty:geo.home.y, vx:0, vy:0, tilt:0, lift:1, liftT:1 });
    render();
    if (!reduced) face.animate([{opacity:0, transform:'scale(.96)'},{opacity:1, transform:'scale(1)'}], { duration:260, easing:'ease-out' });
  }

  coin.addEventListener('pointerdown', onDown);
  coin.addEventListener('pointermove', onMove);
  coin.addEventListener('pointerup', onUp);
  coin.addEventListener('pointercancel', onUp);
  coin.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && (mode === 'idle' || mode === 'return')){
      e.preventDefault();
      Sound.unlock();
      mode = 'insert'; s.tx = geo.slot.x; s.ty = geo.slot.y; s.k = 140; s.c = 24;
    }
  });
  document.getElementById('reset').addEventListener('click', reset);
  const muteBtn = document.getElementById('mute');
  muteBtn.addEventListener('click', () => {
    Sound.muted = !Sound.muted;
    muteBtn.setAttribute('aria-pressed', String(Sound.muted));
    muteBtn.setAttribute('aria-label', Sound.muted ? 'Unmute' : 'Mute');
  });

  addEventListener('resize', () => {
    const before = { ...geo };
    measure();
    if (mode === 'idle' || mode === 'return'){ s.tx = geo.home.x; s.ty = geo.home.y; s.x = s.tx; s.y = s.ty; s.vx = s.vy = 0; }
    else if (mode === 'insert'){ s.tx = geo.slot.x; s.ty = geo.slot.y; if (inserted){ s.x = s.tx; s.y = s.ty; } }
    render();
  });

  measure(); reset();
  requestAnimationFrame(t => { last = t; tick(t); });
})();
</script>
</body>
</html>
