<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wallet to Chips in Color</title>
<meta name="description" content="Color version of a four-step interaction sequence: pick up a wallet, open it, insert a coin into a vending machine and shake loose the stuck chips.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Shared art: the coin (from insert-the-coin), used by the wallet's coins and by the coin in hand -->
<svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <radialGradient id="c-face" cx="40%" cy="35%" r="70%"><stop offset="0%" stop-color="#fff1bd"/><stop offset="55%" stop-color="#e2b64c"/><stop offset="100%" stop-color="#a7781c"/></radialGradient>
    <linearGradient id="c-rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f7dc88"/><stop offset="50%" stop-color="#c9962e"/><stop offset="100%" stop-color="#8a5e12"/></linearGradient>
    <linearGradient id="c-inner" x1="1" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#ecc666"/><stop offset="100%" stop-color="#b38224"/></linearGradient>
    <g id="coinArt" transform="translate(-200 -200)">
      <circle cx="200" cy="200" r="150" fill="url(#c-rim)" stroke="#000" stroke-width="4"/>
      <circle cx="200" cy="200" r="128" fill="url(#c-inner)" stroke="#7a5410" stroke-width="1.5"/>
      <circle cx="200" cy="200" r="120" fill="url(#c-face)" stroke="#946a1c" stroke-width="1"/>
      <circle cx="200" cy="200" r="70" fill="none" stroke="#c99b3c" stroke-width="2" opacity="0.6"/>
      <ellipse cx="160" cy="150" rx="50" ry="28" fill="#ffffff" opacity="0.35" transform="rotate(-35 160 150)"/>
    </g>
  </defs>
</svg>

<div id="app" class="step-1">

  <!-- ============ WORLD: ground + vending machine. The camera is this SVG's viewBox. ============ -->
  <svg id="world" preserveAspectRatio="none" aria-hidden="false" aria-label="The ground, and a vending machine with a bag of chips stuck behind the glass">
    <defs>
      <g id="bagArt" transform="translate(-150,-200)"><g stroke="#000000" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
        <path d="M70,62 L64,90 L60,120 L57,150 L58,180 L55,210 L57,240 L60,270 L63,300 L70,338
                 L230,338 L237,300 L240,270 L243,240 L245,210 L242,180 L243,150 L240,120 L236,90 L230,62 Z"
              fill="#f4ad3d"/>
        <path d="M95,75 L88,140 L86,210 L90,280 L98,325 L112,325 L106,270 L103,210 L105,140 L110,75 Z"
              fill="#ffd66e" stroke="none"/>
        <path d="M70,62 L70,44 L80,36 L90,44 L100,36 L110,44 L120,36 L130,44 L140,36 L150,44
                 L160,36 L170,44 L180,36 L190,44 L200,36 L210,44 L220,36 L230,44 L230,62 Z"
              fill="#e2742a"/>
        <line x1="74" y1="51" x2="226" y2="51" stroke-width="2"/>
        <line x1="74" y1="57" x2="226" y2="57" stroke-width="2"/>
        <path d="M70,338 L70,356 L80,364 L90,356 L100,364 L110,356 L120,364 L130,356 L140,364 L150,356
                 L160,364 L170,356 L180,364 L190,356 L200,364 L210,356 L220,364 L230,356 L230,338 Z"
              fill="#e2742a"/>
        <line x1="74" y1="343" x2="226" y2="343" stroke-width="2"/>
        <line x1="74" y1="349" x2="226" y2="349" stroke-width="2"/>
        <text x="150" y="218" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif"
              font-size="44" font-weight="900" fill="#b8461b" stroke="#000000" stroke-width="1.5">CHIPS</text>
        <g fill="none" stroke-width="2">
          <path d="M82,80 Q108,98 100,128"/>
          <path d="M218,82 Q200,100 210,122"/>
          <path d="M72,250 Q94,262 88,290"/>
          <path d="M226,270 Q204,288 214,318"/>
          <path d="M150,66 L146,90"/>
        </g>
      </g></g>
      <clipPath id="windowClip" clipPathUnits="userSpaceOnUse"><rect x="86.5" y="71.5" width="177" height="377"/></clipPath>
      <clipPath id="openingClip" clipPathUnits="userSpaceOnUse"><rect x="99.4" y="470.2" width="150.8" height="60.4"/></clipPath>
      <linearGradient id="vmPitchGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="1"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
      <linearGradient id="sp-panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f3e8d2"/><stop offset="100%" stop-color="#cdb994"/></linearGradient>
      <linearGradient id="sp-plate" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fbf3e2"/><stop offset="100%" stop-color="#dcc9a6"/></linearGradient>
      <linearGradient id="sp-opening" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#111111"/><stop offset="100%" stop-color="#3a3a3a"/></linearGradient>
    </defs>

    <rect id="groundFill" x="-6000" y="566" width="12000" height="6000"/>
    <ellipse id="vmFloorShadow" cx="200" cy="569" rx="150" ry="2" fill="#000" opacity="0"/>
    <line id="horizon" x1="-6000" y1="566" x2="6000" y2="566" stroke-width="1.5" vector-effect="non-scaling-stroke"/>

    <!-- Vending machine (from shake-the-vending-machine). Its coin slot is the insert-the-coin slot panel, scaled into place. -->
    <g id="machine" tabindex="-1" role="button" aria-label="Vending machine. Hold and move left and right to shake it, or up and down to tilt it forward and back. Arrow keys work too.">
      <rect class="focus-ring" x="48" y="18" width="304" height="560" rx="14" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
      <g id="vmArt"><g stroke="#000000" stroke-width="3" stroke-linejoin="round">
        <rect x="80" y="548" width="40" height="18" fill="#3a3330"/>
        <rect x="280" y="548" width="40" height="18" fill="#3a3330"/>
        <rect x="60" y="30" width="280" height="520" rx="8" fill="#b8483d"/>
        <rect x="85" y="70" width="180" height="380" fill="#f7efe2"/>
        <rect x="95" y="96" width="40" height="44" fill="#7f9c88"/>
        <rect x="155" y="96" width="40" height="44" fill="#d9c7a8"/>
        <rect x="215" y="96" width="40" height="44" fill="#5f7d9c"/>
        <rect x="85" y="140" width="180" height="6" fill="#6b2a24"/>
        <rect x="95" y="172" width="40" height="44" fill="#d9c7a8"/>
        <rect x="155" y="172" width="40" height="44" fill="#5f7d9c"/>
        <rect x="215" y="172" width="40" height="44" fill="#7f9c88"/>
        <rect x="85" y="216" width="180" height="6" fill="#6b2a24"/>
        <rect x="95" y="248" width="40" height="44" fill="#5f7d9c"/>
        <rect x="155" y="248" width="40" height="44" fill="#7f9c88"/>
        <rect x="215" y="248" width="40" height="44" fill="#d9c7a8"/>
        <rect x="85" y="292" width="180" height="6" fill="#6b2a24"/>
        <rect x="95" y="324" width="40" height="44" fill="#7f9c88"/>
        <rect x="155" y="324" width="40" height="44" fill="#d9c7a8"/>
        <rect x="215" y="324" width="40" height="44" fill="#5f7d9c"/>
        <rect x="85" y="368" width="180" height="6" fill="#6b2a24"/>
        <rect x="95" y="400" width="40" height="44" fill="#d9c7a8"/>
        <rect x="155" y="400" width="40" height="44" fill="#5f7d9c"/>
        <rect x="215" y="400" width="40" height="44" fill="#7f9c88"/>
        <rect x="280" y="70" width="45" height="380" fill="#9a3a31"/>
        <rect x="287" y="82" width="31" height="18" fill="#3a3330"/>
        <g stroke-width="2" fill="#f6e9d0">
          <rect x="288" y="115" width="8" height="8"/>
          <rect x="299" y="115" width="8" height="8"/>
          <rect x="310" y="115" width="8" height="8"/>
          <rect x="288" y="126" width="8" height="8"/>
          <rect x="299" y="126" width="8" height="8"/>
          <rect x="310" y="126" width="8" height="8"/>
          <rect x="288" y="137" width="8" height="8"/>
          <rect x="299" y="137" width="8" height="8"/>
          <rect x="310" y="137" width="8" height="8"/>
          <rect x="288" y="148" width="8" height="8"/>
          <rect x="299" y="148" width="8" height="8"/>
          <rect x="310" y="148" width="8" height="8"/>
        </g>
        <rect x="289" y="222" width="27" height="6" fill="#2f2826"/>
        <rect x="292" y="400" width="21" height="30" fill="#6b2a24"/>
        <rect x="85" y="470" width="180" height="55" fill="#8f3229"/>
        <line x1="140" y1="484" x2="210" y2="484" stroke-width="4" stroke-linecap="round"/>
      </g></g>

      <!-- Coin slot panel (insert-the-coin art, 240x260 units scaled to 39x42 machine units) -->
      <g id="slotPanel" transform="translate(302.5 193) scale(0.1625) translate(-200 -200)">
        <g id="slotDip">
          <rect x="80" y="70" width="240" height="260" rx="10" fill="url(#sp-panel)" stroke="#000" stroke-width="4"/>
          <rect id="slotPlate" x="160" y="120" width="80" height="160" rx="8" fill="url(#sp-plate)" stroke="#000" stroke-width="3"/>
          <rect id="slotOutline" x="168" y="128" width="64" height="144" rx="5" fill="none" stroke="#8a7561" stroke-width="1.5"/>
          <rect x="192" y="145" width="16" height="110" rx="8" fill="url(#sp-opening)" stroke="#000" stroke-width="3"/>
          <rect id="slotGlint" x="193.5" y="146.5" width="13" height="107" rx="6.5" fill="#ffffff" opacity="0"/>
          <line id="slotLip" x1="212" y1="153" x2="212" y2="247" stroke="#ffffff" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
        </g>
      </g>

      <g clip-path="url(#windowClip)">
        <use id="bagStuck" href="#bagArt"/>
      </g>
      <g id="tray" transform="translate(58.8,430.8) scale(0.58)"><g stroke="#000000" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
        <rect x="40" y="40" width="320" height="160" rx="6" fill="#b8483d"/>
        <rect x="70" y="68" width="260" height="104" fill="#2b2421"/>
        <polygon points="70,172 330,172 312,146 88,146" fill="#5c2621"/>
        <line x1="70" y1="68" x2="88" y2="146" stroke-width="2"/>
        <line x1="330" y1="68" x2="312" y2="146" stroke-width="2"/>
      </g></g>
      <g clip-path="url(#openingClip)">
        <use id="bagTray" href="#bagArt" visibility="hidden"/>
      </g>
      <g id="trayFront" transform="translate(58.8,430.8) scale(0.58)"><g stroke="#000000" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
        <rect x="70" y="68" width="260" height="52" fill="#a23d33"/>
        <line x1="160" y1="108" x2="240" y2="108" stroke-width="4"/>
        <rect x="60" y="172" width="280" height="14" rx="3" fill="#c45a4d"/>
      </g></g>
      <!-- forward/backward tilt shading (drawn over the cabinet face) -->
      <rect id="vmPitchShade" x="60" y="30" width="280" height="520" rx="8" fill="url(#vmPitchGrad)" opacity="0" pointer-events="none"/>
    </g>
  </svg>

  <!-- ============ WALLET (from open-the-wallet). Held in screen space: on the ground, then in hand. ============ -->
  <div id="walletPose">
    <div id="wShadow"></div>
    <div id="walletTilt" tabindex="0" role="button" aria-label="Wallet">
      <div id="wstage">
        <svg id="base" viewBox="0 0 400 260" aria-hidden="true">
          <defs>
            <clipPath id="rightHalf"><rect x="196" y="0" width="210" height="260"/></clipPath>
          </defs>
          <rect x="60" y="60" width="280" height="150" rx="10" ry="10" fill="#6e3f22" stroke="#000" stroke-width="2" clip-path="url(#rightHalf)"/>
          <path id="flapShadow" d="M200 64 L338 60 L340 208 L200 208 Z" fill="#4f2b16"/>
          <path d="M200 60 L336 52 A10 10 0 0 1 346 62 L348 196 A10 10 0 0 1 338 206 L200 210 Z"
                fill="#b97a4b" stroke="#000" stroke-width="2" stroke-linejoin="round"/>
          <path d="M208 67 L332 60 A6 6 0 0 1 338 66 L340 192 A6 6 0 0 1 334 198 L208 201 Z"
                fill="none" stroke="#e8c48f" stroke-width="1.5" stroke-dasharray="5 4" stroke-linejoin="round"/>

          <!-- The three coins, tucked into the right-hand pocket -->
          <g id="coins">
            <g class="wcoin" data-tilt="-14" aria-label="Coin" transform="translate(237 112) rotate(-14) scale(0.43 0.36)">
              <ellipse cx="5" cy="10" rx="62" ry="62" fill="#000" opacity="0.18"/>
              <g class="coin" style="animation-delay:.06s"><use href="#coinArt" transform="scale(0.4133)"/></g>
              <circle class="coinRing" r="80" fill="none" stroke-width="5" stroke-dasharray="14 12"/>
            </g>
            <g class="wcoin" data-tilt="11" aria-label="Coin" transform="translate(306 99) rotate(11) scale(0.41 0.39)">
              <ellipse cx="-4" cy="9" rx="62" ry="62" fill="#000" opacity="0.18"/>
              <g class="coin" style="animation-delay:.14s"><use href="#coinArt" transform="scale(0.4133)"/></g>
              <circle class="coinRing" r="80" fill="none" stroke-width="5" stroke-dasharray="14 12"/>
            </g>
            <g class="wcoin" data-tilt="-4" aria-label="Coin" transform="translate(268 116) rotate(-4) scale(0.45 0.42)">
              <ellipse cx="3" cy="10" rx="62" ry="62" fill="#000" opacity="0.2"/>
              <g class="coin" style="animation-delay:0s"><use href="#coinArt" transform="scale(0.4133)"/></g>
              <circle class="coinRing" r="80" fill="none" stroke-width="5" stroke-dasharray="14 12"/>
            </g>
          </g>

          <path d="M210 125 Q272 114 334 121 L336 194 L210 197 Z" fill="#a5653b" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M210 158 Q272 148 335 154 L336 194 L210 197 Z" fill="#965834" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/>

          <path id="innerShade" d="M200 60 L336 52 A10 10 0 0 1 346 62 L348 196 A10 10 0 0 1 338 206 L200 210 Z" fill="#000" opacity="0.35"/>

          <line x1="200" y1="60" x2="200" y2="210" stroke="#000" stroke-width="3"/>
          <path id="foldInner" d="M204 62 L204 208" fill="none" stroke="#5a3119" stroke-width="2"/>
        </svg>

        <div id="coverWrap">
          <div id="cover">
            <div class="face" id="inner">
              <svg viewBox="0 0 400 260" aria-hidden="true">
                <defs>
                  <linearGradient id="shadeIn" x1="200" y1="0" x2="60" y2="0" gradientUnits="userSpaceOnUse">
                    <stop offset="0" stop-color="#000" stop-opacity="0.15"/>
                    <stop offset="1" stop-color="#000" stop-opacity="0.75"/>
                  </linearGradient>
                </defs>
                <path class="hit" d="M70 60 H200 V210 H70 A10 10 0 0 1 60 200 V70 A10 10 0 0 1 70 60 Z"
                      fill="#ad6c40" stroke="#000" stroke-width="2"/>
                <path d="M76 70 H192 V200 H76 A6 6 0 0 1 70 194 V76 A6 6 0 0 1 76 70 Z"
                      fill="none" stroke="#e8c48f" stroke-width="1.5" stroke-dasharray="5 4"/>
                <path d="M78 110 Q134 100 190 110 V198 H78 Z" fill="#9d5d35" stroke="#000" stroke-width="1.5"/>
                <path d="M78 135 Q134 125 190 135 V198 H78 Z" fill="#8f532f" stroke="#000" stroke-width="1.5"/>
                <path d="M78 160 Q134 150 190 160 V198 H78 Z" fill="#834a29" stroke="#000" stroke-width="1.5"/>
                <g id="creasesIn" fill="none" stroke="#000" stroke-linecap="round"></g>
                <path id="shadeInRect" d="M70 60 H200 V210 H70 A10 10 0 0 1 60 200 V70 A10 10 0 0 1 70 60 Z"
                      fill="url(#shadeIn)" opacity="0" pointer-events="none"/>
              </svg>
            </div>
            <div class="face" id="outer">
              <svg viewBox="0 0 400 260" aria-hidden="true">
                <defs>
                  <linearGradient id="shadeOut" x1="200" y1="0" x2="340" y2="0" gradientUnits="userSpaceOnUse">
                    <stop offset="0" stop-color="#000" stop-opacity="0.15"/>
                    <stop offset="1" stop-color="#000" stop-opacity="0.75"/>
                  </linearGradient>
                </defs>
                <g transform="translate(400 0) scale(-1 1)">
                  <path class="hit" d="M70 60 H200 V210 H70 A10 10 0 0 1 60 200 V70 A10 10 0 0 1 70 60 Z"
                        fill="#8a522d" stroke="#000" stroke-width="2"/>
                  <path d="M76 70 H192 V200 H76 A6 6 0 0 1 70 194 V76 A6 6 0 0 1 76 70 Z"
                        fill="none" stroke="#e8c48f" stroke-width="1.5" stroke-dasharray="5 4"/>
                </g>
                <path d="M334 61 Q339 62 339 68 V202 Q339 208 334 209" fill="none" stroke="#b47a4c" stroke-width="3" pointer-events="none"/>
                <path id="edgeGlow" d="M333 64 V206" fill="none" stroke="#ffe7c2" stroke-width="2.5" stroke-linecap="round" pointer-events="none"/>
                <g id="creasesOut" fill="none" stroke="#000" stroke-linecap="round"></g>
                <path id="shadeOutRect" d="M330 60 H200 V210 H330 A10 10 0 0 0 340 200 V70 A10 10 0 0 0 330 60 Z"
                      fill="url(#shadeOut)" opacity="0" pointer-events="none"/>
                <rect class="hit" x="300" y="56" width="50" height="158" fill="transparent"/>
              </svg>
            </div>
          </div>
        </div>

        <!-- Pick-up signifier + grab strip along the near (bottom) edge of the closed wallet -->
        <svg id="overlay" viewBox="0 0 400 260" aria-hidden="true">
          <path d="M204 199 H330" fill="none" stroke="#b47a4c" stroke-width="3" pointer-events="none"/>
          <path id="pickGlow" d="M208 195 H326" fill="none" stroke="#ffe7c2" stroke-width="2.5" stroke-linecap="round"/>
          <rect id="pickHit" x="190" y="112" width="170" height="122" fill="transparent"/>
          <rect class="wring wring-closed" x="186" y="40" width="174" height="186" rx="12" fill="none" stroke-width="1.5" stroke-dasharray="6 6"/>
          <rect class="wring wring-open" x="48" y="40" width="312" height="186" rx="12" fill="none" stroke-width="1.5" stroke-dasharray="6 6"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- ============ COIN IN HAND (from insert-the-coin) ============ -->
  <div id="coin" aria-hidden="true">
    <div class="face">
      <svg viewBox="-152 -152 304 304"><use href="#coinArt"/></svg>
    </div>
  </div>

  <!-- ============ UI ============ -->
  <ol id="progress" aria-label="Progress">
    <li data-step="1"><span class="n">1</span><span class="t">Pick up</span></li>
    <li data-step="2"><span class="n">2</span><span class="t">Open</span></li>
    <li data-step="3"><span class="n">3</span><span class="t">Insert</span></li>
    <li data-step="4"><span class="n">4</span><span class="t">Shake</span></li>
  </ol>

  <div class="controls">
    <button id="refineBtn" class="ctrl ctrl-wide" type="button" aria-expanded="false" aria-controls="refine">Refine</button>
    <button id="toolsBtn" class="ctrl" type="button" aria-label="Tools" aria-expanded="false" aria-controls="tools">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 6h10"/><path d="M18 6h2"/><circle cx="16" cy="6" r="2"/>
        <path d="M4 12h4"/><path d="M12 12h8"/><circle cx="10" cy="12" r="2"/>
        <path d="M4 18h12"/><path d="M20 18h0"/><circle cx="18" cy="18" r="2"/>
      </svg>
    </button>
    <button id="sound" class="ctrl" type="button" aria-label="Mute sound" aria-pressed="false">
      <svg class="on" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/>
      </svg>
      <svg class="off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6"/><path d="M22 9l-5 6"/>
      </svg>
    </button>
  </div>

  <!-- Tool panel: live design controls (does not touch the interactions) -->
  <div id="tools" class="tools" role="dialog" aria-label="Tools" hidden>
    <div class="tools-title">Tools</div>
    <div class="tools-row">
      <label for="bgColor">Background</label>
      <input type="color" id="bgColor" value="#f4efe7">
      <output id="bgHex" for="bgColor">#F4EFE7</output>
    </div>
    <button id="bgReset" class="tools-reset" type="button">Reset to theme color</button>
  </div>

  <!-- Refinement panel: tunes the real wallet / machine / chips behaviour -->
  <div id="refine" class="tools refine" role="region" aria-label="Refinement panel" hidden>
    <div class="tools-title">Refinement</div>
    <div class="tools-field">
      <div class="tools-head"><label for="rfOpen">Wallet opening angle</label><output id="rfOpenOut" for="rfOpen">180°</output></div>
      <input type="range" id="rfOpen" min="0" max="180" step="1" value="180">
      <p id="rfOpenNote" class="tools-note" hidden>Below 90° the cover stays partly over the coins.</p>
    </div>
    <div class="tools-field">
      <div class="tools-head"><label for="rfShake">Machine shake amount</label><output id="rfShakeOut" for="rfShake">16 px</output></div>
      <input type="range" id="rfShake" min="0" max="30" step="1" value="16">
    </div>
    <div class="tools-field">
      <div class="tools-head"><label for="rfFall">Chip falling speed</label><output id="rfFallOut" for="rfFall">5</output></div>
      <input type="range" id="rfFall" min="1" max="10" step="1" value="5">
    </div>
    <div class="tools-field">
      <div class="tools-head"><label for="rfSide">Side tilt intensity</label><output id="rfSideOut" for="rfSide">100%</output></div>
      <input type="range" id="rfSide" min="25" max="200" step="5" value="100">
    </div>
    <div class="tools-field">
      <div class="tools-head"><label for="rfPitch">Forward/back tilt intensity</label><output id="rfPitchOut" for="rfPitch">100%</output></div>
      <input type="range" id="rfPitch" min="0" max="200" step="5" value="100">
    </div>
    <button id="rfReset" class="tools-reset" type="button">Reset to defaults</button>
  </div>
